<title>Central de Alertas Zanelato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Fahkwang:wght@500&display=swap">
<style>
/* Layout: cabeçalho com logo e título leve; barra de data em pílulas; números grandes em Fahkwang; grade de cartões grafite sem sombra. Escuro primeiro, tokens do Design System Zanelato. */
:root {
  /* marca */
  --preto: #0D0D0D; --grafite: #222323; --roxo: #703FE8; --taupe: #736B65; --cinza: #BFBCB8; --off-white: #F2F1F0; --lilas: #D3C7F9;
  --gradiente-marca: linear-gradient(26deg, #D3C7F9 4%, #AB90F2 21%, #7F54EB 47%, #703FE8 68%);
  --gradiente-barra: linear-gradient(90deg, #D3C7F9, #703FE8);
  /* papéis — escuro */
  --fundo: var(--preto); --superficie: var(--grafite); --texto: var(--off-white); --texto-suave: var(--cinza); --borda: var(--taupe);
  --destaque: var(--roxo); --sobre-destaque: var(--off-white); --destaque-texto: var(--lilas);
  --superficie-2: var(--preto);
  --alerta: #FF5C6C; --alerta-fundo: rgba(255,92,108,.14); --sobre-alerta: #0D0D0D;
  /* tipo e forma */
  --f-marca: "Alexandria", system-ui, sans-serif;
  --f-apoio: "Fahkwang", "Alexandria", sans-serif;
  --raio-sm: 8px; --raio-md: 16px; --raio-lg: 32px; --raio-pilula: 999px;
  --e1: 8px; --e2: 16px; --e3: 24px; --e4: 48px;
  /* nomes usados pelo script */
  --bg: var(--fundo); --surface: var(--superficie); --surface-2: var(--superficie-2); --line: var(--borda); --fg: var(--texto); --muted: var(--texto-suave);
  --accent: var(--destaque-texto); --crit: var(--destaque-texto); --warn: var(--texto); --pend: var(--texto-suave); --ok: var(--texto-suave);
  color-scheme: dark;
}
/* Claro é o padrão; o escuro só entra pelo botão de tema (data-tema="escuro"). */
:root:not([data-tema="escuro"]) {
  --fundo: var(--off-white); --superficie: #FFFFFF; --texto: var(--preto); --texto-suave: var(--taupe); --borda: var(--cinza);
  --destaque-texto: var(--roxo); --superficie-2: var(--off-white);
  --alerta: #D42A3A; --alerta-fundo: rgba(212,42,58,.10); --sobre-alerta: #FFFFFF;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--fundo); color: var(--texto); font: 300 16px/1.55 var(--f-marca); margin: 0; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: var(--e4); padding-block: var(--e3) var(--e4); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e3); }
#ticker, #tv .tvbody > * { min-width: 0; }
h1, h2, h3 { font-family: var(--f-marca); text-wrap: balance; margin: 0; }
b, strong { font-weight: 700; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--destaque-texto); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--texto-suave); }
.eyebrow { font-size: 12px; line-height: 1.3; letter-spacing: .3em; text-transform: uppercase; color: var(--texto-suave); font-weight: 400; }

/* topo */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--e2) var(--e3); padding-bottom: var(--e3); border-bottom: 1px solid var(--borda); }
.brand { display: grid; gap: var(--e2); min-width: 0; }
.logo { height: 44px; width: auto; display: block; max-width: 100%; }
.logo.claro { display: none; }
:root:not([data-tema="escuro"]) .logo.escuro { display: none; } :root:not([data-tema="escuro"]) .logo.claro { display: block; }
.brand h1 { font-size: 32px; line-height: 1.15; font-weight: 300; }
.brand h1 b { font-weight: 700; }
.brand .sub { color: var(--texto-suave); font-size: 13px; line-height: 1.4; }
.top-actions { display: flex; gap: var(--e1); flex-wrap: wrap; }
.btn { border: 1px solid var(--borda); background: transparent; padding: 9px 18px; border-radius: var(--raio-pilula); font-size: 13px; line-height: 1.4; font-weight: 400; display: inline-flex; align-items: center; gap: var(--e1); text-decoration: none; color: var(--texto); transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--texto); }
.btn.primary { background: var(--destaque); color: var(--sobre-destaque); border-color: var(--destaque); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { border-color: transparent; }
.btn.acao { border-color: var(--destaque-texto); color: var(--destaque-texto); }
.btn.acao:hover { background: var(--destaque); border-color: var(--destaque); color: var(--sobre-destaque); }
.btn.ghost:hover { border-color: var(--borda); }
.btn.sm { padding: 6px 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* barra de data */
.datebar { display: flex; flex-wrap: wrap; gap: var(--e2); align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--borda); border-radius: var(--raio-pilula); padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: var(--raio-pilula); color: var(--texto-suave); font-size: 13px; font-weight: 400; }
.seg button[aria-pressed="true"] { background: var(--texto); color: var(--fundo); }
.daynav { display: inline-flex; align-items: center; gap: var(--e1); }
.daynav .label { min-width: 190px; text-align: center; font-weight: 500; font-size: 16px; line-height: 1.3; }
.daynav .label small { display: block; font-weight: 300; color: var(--texto-suave); font-size: 13px; }
.iconbtn { border: 1px solid var(--borda); background: transparent; width: 34px; height: 34px; border-radius: var(--raio-pilula); display: grid; place-items: center; font-size: 16px; }
.iconbtn:hover:not([disabled]) { border-color: var(--texto); }
.iconbtn[disabled] { opacity: .35; cursor: default; }
.datebar input[type=date] { background: transparent; border: 1px solid var(--borda); border-radius: var(--raio-sm); padding: 6px 10px; font-size: 13px; }
.spacer { flex: 1; }
.live { display: inline-flex; align-items: center; gap: var(--e1); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--texto-suave); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--destaque-texto); }
.live.off i { background: transparent; border: 1px solid var(--texto-suave); }

.cats { display: flex; flex-wrap: wrap; gap: var(--e1); }
.chip { border: 1px solid var(--borda); background: transparent; border-radius: var(--raio-pilula); padding: 6px 14px; display: inline-flex; align-items: center; gap: var(--e1); font-size: 13px; line-height: 1.4; }
.chip .n { font-size: 12px; color: var(--texto-suave); }
.chip[aria-pressed="true"] { border-color: var(--texto); background: var(--texto); color: var(--fundo); }
.chip[aria-pressed="true"] .n { color: var(--fundo); }
.dot { display: none; }

.filters { display: flex; flex-wrap: wrap; gap: var(--e2); align-items: center; }
.filters select, .filters input[type=search] { background: transparent; border: 1px solid var(--borda); border-radius: var(--raio-sm); padding: 7px 12px; font-size: 13px; }
.filters input[type=search] { min-width: 0; flex: 1 1 200px; max-width: 320px; }

/* cartões */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--e2); align-items: start; }
.card { background: var(--superficie); border: 1px solid transparent; border-radius: var(--raio-md); display: grid; min-width: 0; }
.card[data-status="aberto"][data-sev="critico"] { border-color: var(--alerta); }
.card[data-status="resolvido"] { background: transparent; border-color: var(--borda); }
.card[data-status="resolvido"] .issues, .card[data-status="resolvido"] h3 { opacity: .6; }
.card-h { padding: var(--e3) var(--e3) var(--e2); display: grid; gap: var(--e1); }
.card-h .row { display: flex; gap: var(--e2); align-items: flex-start; justify-content: space-between; }
.card-h h3 { font-size: 20px; line-height: 1.3; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: var(--e1) var(--e2); font-size: 13px; line-height: 1.4; color: var(--texto-suave); align-items: center; }
.pills { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-size: 12px; line-height: 1.3; font-weight: 400; border-radius: var(--raio-pilula); padding: 3px 10px; white-space: nowrap; border: 1px solid var(--borda); color: var(--texto-suave); }
.pill.aberto { color: var(--texto); border-color: var(--texto); }
.pill.notificado { color: var(--texto); border-color: var(--texto-suave); }
.pill.resolvido::before { content: "✓ "; }
.pill.sev-critico { color: var(--sobre-alerta); background: var(--alerta); border-color: var(--alerta); font-weight: 500; }
.pill.sev-atencao { color: var(--texto); }
.gsel { background: transparent; border: 1px dashed var(--borda); border-radius: var(--raio-sm); padding: 2px 8px; font-size: 13px; color: var(--texto); max-width: 220px; }
.gsel.none { color: var(--texto-suave); }
.issues { list-style: none; margin: 0; padding: 0 var(--e3); display: grid; }
.issue { padding: var(--e2) 0; border-top: 1px solid var(--borda); display: grid; gap: 6px; }
.issue .t { display: flex; gap: var(--e1); align-items: flex-start; justify-content: space-between; }
.issue .t strong { font-weight: 500; min-width: 0; }
.issue .tag { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--texto-suave); }
.issue .lines { font-size: 13px; line-height: 1.4; color: var(--texto-suave); }
.issue[data-status="resolvido"] .t strong { text-decoration: line-through; text-decoration-color: var(--texto-suave); }
.cmp { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--e2); font-size: 13px; line-height: 1.4; align-items: center; }
.cmp .k { color: var(--texto-suave); }
.cmp .val { font-weight: 400; }
.bar { position: relative; height: 6px; background: var(--fundo); border-radius: var(--raio-pilula); margin-top: 4px; }
.card[data-status="resolvido"] .bar { background: var(--superficie); }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: var(--raio-pilula); background: var(--texto-suave); }
.bar.critico .fill { background: var(--alerta); }
.bar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--texto); border-radius: 1px; }
.repeat { font-size: 12px; line-height: 1.3; font-weight: 500; color: var(--alerta); white-space: nowrap; }
.mini { border: 0; background: transparent; color: var(--texto-suave); font-size: 13px; padding: 2px 6px; border-radius: var(--raio-sm); white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--borda); }
.mini:hover { color: var(--texto); }
.card-f { display: flex; gap: var(--e1); flex-wrap: wrap; align-items: center; padding: var(--e2) var(--e3) var(--e3); border-top: 1px solid var(--borda); }
.card-f .who { font-size: 13px; line-height: 1.4; color: var(--texto-suave); flex: 1 1 100%; min-width: 0; }

.empty { border: 1px dashed var(--borda); border-radius: var(--raio-md); padding: var(--e4) var(--e3); text-align: center; display: grid; gap: var(--e1); justify-items: center; color: var(--texto-suave); }
.empty h2 { font-size: 20px; line-height: 1.3; font-weight: 500; color: var(--texto); }

/* matriz */
.matrix-wrap { overflow-x: auto; background: var(--superficie); border-radius: var(--raio-md); }
table.matrix { border-collapse: collapse; width: 100%; min-width: 680px; }
.matrix th, .matrix td { padding: 10px 12px; border-bottom: 1px solid var(--borda); text-align: center; font-size: 13px; }
.matrix th { font-weight: 400; color: var(--texto-suave); font-size: 12px; letter-spacing: .15em; text-transform: uppercase; }
.matrix th.acc, .matrix td.acc { text-align: left; white-space: nowrap; }
.matrix td.acc { font-weight: 500; }
.matrix tr:last-child td { border-bottom: 0; }
.cell { width: 100%; min-width: 46px; height: 32px; border-radius: var(--raio-sm); border: 1px solid transparent; background: transparent; font-size: 13px; }
.cell.critico { background: var(--alerta); color: var(--sobre-alerta); font-weight: 500; }
.cell.atencao { border-color: var(--texto); color: var(--texto); }
.cell.config { border: 1px dashed var(--texto-suave); color: var(--texto-suave); }
.cell.resolvido { color: var(--texto-suave); }
.cell.vazio { color: var(--borda); cursor: default; }
.legend { display: flex; gap: var(--e2); flex-wrap: wrap; font-size: 13px; color: var(--texto-suave); padding: var(--e2) var(--e3); }
.legend span { display: inline-flex; gap: var(--e1); align-items: center; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

/* diálogos */
.scrim { position: fixed; inset: 0; background: rgba(13,13,13,.72); display: grid; place-items: center; padding: var(--e2); z-index: 50; }
.dialog { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio-md); width: min(680px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: grid; gap: var(--e2); padding: var(--e3); }
.dialog h2 { font-size: 20px; line-height: 1.3; font-weight: 500; }
.dialog label { display: grid; gap: 6px; font-size: 13px; color: var(--texto-suave); }
.dialog textarea, .dialog input, .dialog select { background: var(--fundo); border: 1px solid var(--borda); border-radius: var(--raio-sm); padding: 9px 12px; color: var(--texto); width: 100%; font-size: 14px; }
.dialog textarea { min-height: 170px; resize: vertical; line-height: 1.5; }
.dialog .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e2); }
.dialog .acts { display: flex; gap: var(--e1); flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.note { font-size: 13px; line-height: 1.4; color: var(--texto-suave); margin: 0; }
.checks { display: flex; flex-wrap: wrap; gap: var(--e1) var(--e3); }
.dialog label.check { display: inline-flex; align-items: center; gap: var(--e1); color: var(--texto); font-size: 14px; }
.dialog label.check input { accent-color: var(--roxo); }
.dialog .acts .spacer { flex: 1; }
.tasklink { font-size: 13px; color: var(--destaque-texto); text-decoration: none; white-space: nowrap; }
.tasklink:hover { text-decoration: underline; }
.preview { display: grid; gap: 6px; max-height: 240px; overflow: auto; }
.preview .p { display: flex; gap: var(--e1); justify-content: space-between; font-size: 13px; background: var(--fundo); border-radius: var(--raio-sm); padding: 8px 12px; }
.glist { display: grid; gap: var(--e1); }
.grow { display: grid; grid-template-columns: 1fr 1fr auto; gap: var(--e1); align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--texto); color: var(--fundo); padding: 10px 20px; border-radius: var(--raio-pilula); font-size: 13px; font-weight: 400; z-index: 60; max-width: calc(100% - 32px); }

/* KPIs 3 x 2 */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--e2); }
.kpi { background: var(--superficie); border: 1px solid transparent; border-radius: var(--raio-md); padding: var(--e3); display: grid; gap: var(--e1); align-content: start; min-height: 150px; min-width: 0; transition: border-color .2s; }
.kpi .vrow { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--e1); }
.kpi .v { font-family: var(--f-apoio); font-size: 48px; line-height: 1.1; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 13px; line-height: 1.4; color: var(--texto-suave); display: flex; flex-wrap: wrap; gap: 6px var(--e1); align-items: center; }
.kpi.hero { background: var(--destaque); color: var(--sobre-destaque); }
.kpi.k-critico .v { color: var(--alerta); }
.kpi.k-critico .spark-line { stroke: var(--alerta); } .kpi.k-critico .spark-area, .kpi.k-critico .spark-dot { fill: var(--alerta); }
.kpi.hero .eyebrow, .kpi.hero .d { color: var(--sobre-destaque); }
.kpi.hero .spark-line, .kpi.hero .spark-dot { stroke: var(--off-white); fill: var(--off-white); }
.kpi.hero .spark-line { fill: none; }
.kpi.hero .spark-area { fill: var(--off-white); }
.kpi.hero .delta { border-color: rgba(242,241,240,.5); color: var(--sobre-destaque); }
.kpi.clickable { cursor: pointer; }
.kpi.clickable:hover { border-color: var(--texto-suave); }
.kpi.active { border-color: var(--texto); }
.kpi.hero.active { border-color: var(--off-white); box-shadow: inset 0 0 0 1px var(--off-white); }
.sparkwrap, .ringwrap { display: block; flex: none; line-height: 0; }
.spark-area { fill: var(--destaque-texto); opacity: .16; }
.spark-line { fill: none; stroke: var(--destaque-texto); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.spark-dot { fill: var(--destaque-texto); }
.ring-bg { fill: none; stroke: var(--borda); stroke-width: 7; }
.ringarc { fill: none; stroke: var(--destaque-texto); stroke-width: 7; stroke-linecap: round; transition: stroke-dasharray .9s ease; }
.ring-txt { font: 500 14px var(--f-marca); fill: var(--texto); }
.delta { font-size: 12px; line-height: 1; font-weight: 500; padding: 4px 8px; border-radius: var(--raio-pilula); border: 1px solid var(--borda); white-space: nowrap; color: var(--texto-suave); }
.delta.worse { color: var(--alerta); border-color: var(--alerta); background: var(--alerta-fundo); }
.delta.better { color: var(--texto); border-color: var(--texto-suave); }

/* skeleton */
.skel { display: inline-block; width: 64px; height: .9em; border-radius: var(--raio-sm); vertical-align: -1px;
  background: linear-gradient(90deg, var(--fundo) 25%, var(--borda) 50%, var(--fundo) 75%); background-size: 200% 100%; animation: shim 1.2s linear infinite; }
.skelblock { display: flex; flex-direction: column; gap: var(--e1); padding: 6px 0; }
.skelblock i { display: block; height: 12px; border-radius: var(--raio-pilula);
  background: linear-gradient(90deg, var(--fundo) 25%, var(--borda) 50%, var(--fundo) 75%); background-size: 200% 100%; animation: shim 1.2s linear infinite; }
.skelblock i:nth-child(2) { width: 82%; } .skelblock i:nth-child(3) { width: 64%; } .skelblock i:nth-child(4) { width: 40%; }
.skelcard { padding: var(--e3); min-height: 180px; }
@keyframes shim { to { background-position: -200% 0; } }

/* ao vivo */
.live i { animation: live 1.8s ease-out infinite; }
.live.off i { animation: none; }
@keyframes live { 0% { box-shadow: 0 0 0 0 rgba(211,199,249,.6); } 100% { box-shadow: 0 0 0 10px rgba(211,199,249,0); } }

/* faixa de alertas */
.ticker { display: flex; align-items: center; gap: var(--e2); border: 1px solid var(--borda); border-radius: var(--raio-pilula); padding: 10px var(--e3); overflow: hidden; }
.tk-lbl { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--texto-suave); flex: none; }
.tk-view { overflow: hidden; flex: 1; min-width: 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.tk-track { display: inline-flex; gap: 40px; white-space: nowrap; animation: tk var(--dur, 40s) linear infinite; }
.ticker:hover .tk-track, .ticker:focus-within .tk-track { animation-play-state: paused; }
.tk-dup { display: inline-flex; gap: 40px; }
.tk-item { display: inline-flex; align-items: center; gap: var(--e1); font-size: 14px; cursor: pointer; border-radius: var(--raio-sm); }
.tk-item b { font-weight: 500; }
.tk-item i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--texto-suave); flex: none; }
.tk-item.critico i { background: var(--alerta); border-color: var(--alerta); }
.tk-item.atencao i { background: var(--texto); border-color: var(--texto); }
.tk-st { font-size: 12px; color: var(--texto-suave); }
@keyframes tk { to { transform: translateX(-50%); } }

/* painel: corrida do mês */
.insights { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e2); }
.panel { background: var(--superficie); border-radius: var(--raio-md); padding: var(--e3); display: grid; gap: var(--e2); min-width: 0; }
.phd { display: grid; gap: 4px; }
.phd h2 { font-size: 20px; line-height: 1.3; font-weight: 300; }
.phd h2 b { font-weight: 700; }
.racebox { position: relative; height: 300px; }
.racebox.tv { height: 56vh; }

/* transição de aba e destaque de cartão */
.fadein { animation: fadein .35s ease both; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { border-color: var(--alerta); } 100% { border-color: transparent; } }

/* tabela com 1ª coluna fixa */
.matrix th.acc, .matrix td.acc { position: sticky; left: 0; z-index: 1; background: var(--superficie); box-shadow: inset -1px 0 0 var(--borda); }

/* modo TV */
#tv { position: fixed; inset: 0; z-index: 70; background: var(--fundo); overflow: auto; padding: calc(var(--e2) + env(safe-area-inset-top, 0px)) clamp(16px, 2.5vw, 48px) 32px; }

<script>
(() => {
  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(k));
    return n;
  };
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); };
  const ddmm = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : "";
  const WEEK = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  const slug = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 80) || "x";
  const brl = n => n == null ? "—" : "R$ " + n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const parseBRL = s => { const m = String(s).match(/-?[\d.]+(?:,\d+)?/); return m ? Number(m[0].replace(/\./g, "").replace(",", ".")) : null; };
  const hhmm = ts => { if (!ts) return ""; const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const TODAY = iso(new Date());

  const CATS = {
    investimento: { label: "Investimento", color: "var(--warn)" },
    custo: { label: "CPL / CPA", color: "var(--crit)" },
    leads: { label: "Perda de leads", color: "var(--accent)" },
    configuracao: { label: "Configuração", color: "var(--pend)" },
    ciclo: { label: "Ciclos", color: "var(--crit)" },
    outro: { label: "Outros", color: "var(--muted)" },
  };
  const SEV_RANK = { critico: 3, atencao: 2, config: 1 };

  // ---------- state ----------
  const S = {
    db: null, user: null, me: null, canWrite: true,
    alerts: [], gestores: {}, contas: {},
    date: TODAY, mode: "dia", cat: "", status: "todos", extra: "", gestor: "", q: "", loaded: false,
    names: {},
  };
  try { const saved = JSON.parse(localStorage.getItem("ca.filters") || "{}"); if (saved.status) S.status = saved.status; } catch (e) {}
  const saveFilters = () => { try { localStorage.setItem("ca.filters", JSON.stringify({ status: S.status })); } catch (e) {} };

  // ---------- parser (texto copiado do WhatsApp) ----------
  const HEADER_RE = /Alerta\s+(de\s+Ciclos\s+)?[—–-]\s*(.+?)\s*$/i;
  const PREFIX_RE = /^\s*\[?(\d{1,2}):(\d{2})(?::\d{2})?,?\s+(\d{1,2})\/(\d{1,2})\/(\d{2,4})\]?\s*(?:-\s*)?[^:]{1,60}:\s*/;
  const PREFIX_RE2 = /^\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4}),?\s+(\d{1,2}):(\d{2})\s*-\s*[^:]{1,60}:\s*/;
  const TITLE_RE = /^(Investimento\b.*planejad|CP[LA]\b.*planejad|CP[LA]\s+n[aã]o\s+configurad|Programa[cç][aã]o\b|Perda de leads|Or[cç]amento\b|ROAS\b|Connect rate\b)/i;
  const strip = s => s.replace(/^[^\p{L}\p{N}]+/u, "").trim();

  function inferDate(dd, mm, ctxIso) {
    const ctx = fromIso(ctxIso);
    let d = new Date(ctx.getFullYear(), mm - 1, dd);
    if (d - ctx > 7 * 864e5) d = new Date(ctx.getFullYear() - 1, mm - 1, dd);
    return iso(d);
  }

  function classify(title) {
    const t = title.toLowerCase();
    const pm = t.match(/(\d+(?:[.,]\d+)?)\s*%\s*(abaixo|acima)/);
    const pct = pm ? Number(pm[1].replace(",", ".")) : null;
    const dir = pm ? pm[2] : null;
    if (/^investimento/.test(t)) return { kind: "invest", category: "investimento", pct, dir, severity: pct != null && pct >= 30 ? "critico" : "atencao" };
    if (/^cpl\b.*planejad/.test(t)) return { kind: "cpl", category: "custo", pct, dir, severity: pct != null && pct >= 50 ? "critico" : "atencao" };
    if (/^cpa\b.*planejad/.test(t)) return { kind: "cpa", category: "custo", pct, dir, severity: pct != null && pct >= 50 ? "critico" : "atencao" };
    if (/^cp[la]\s+n[aã]o\s+configurad/.test(t)) return { kind: t.startsWith("cpl") ? "cpl_config" : "cpa_config", category: "configuracao", severity: "config" };
    if (/^programa[cç][aã]o\s+vencida/.test(t)) return { kind: "prog_vencida", category: "configuracao", severity: "config" };
    if (/^programa[cç][aã]o/.test(t)) return { kind: "prog_config", category: "configuracao", severity: "config" };
    if (/^perda de leads/.test(t)) return { kind: "leads", category: "leads", severity: "critico" };
    return { kind: "outro-" + slug(title).slice(0, 30), category: "outro", pct, dir, severity: "atencao" };
  }

  function finishIssue(it) {
    for (const ln of it.lines) {
      const m = ln.match(/^(Ontem|Hoje|Atual)\s*:\s*(.+)$/i);
      const p = ln.match(/^(Planejado|Aceit[aá]vel|Meta)\s*:\s*(.+)$/i);
      if (m) it.actual = /%/.test(m[2]) && !/R\$/.test(m[2]) ? parseFloat(m[2]) : parseBRL(m[2]);
      if (p) it.planned = /%/.test(p[2]) && !/R\$/.test(p[2]) ? parseFloat(p[2]) : parseBRL(p[2]);
      if (m || p) it.unit = /%/.test((m || p)[2]) && !/R\$/.test((m || p)[2]) ? "%" : "R$";
    }
    return it;
  }

  function parseWhatsApp(text, defaultSent) {
    const msgs = [];
    let cur = null, pendingSent = null;
    for (let raw of text.replace(/\r/g, "").split("\n")) {
      let m = raw.match(PREFIX_RE), sent = null;
      if (m) { sent = `${m[5].length === 2 ? "20" + m[5] : m[5]}-${pad(m[4])}-${pad(m[3])}`; raw = raw.slice(m[0].length); }
      else if ((m = raw.match(PREFIX_RE2))) { sent = `${m[3].length === 2 ? "20" + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}`; raw = raw.slice(m[0].length); }
      if (sent) pendingSent = sent;
      const line = raw.trim();
      const h = line.match(HEADER_RE);
      if (h && /alerta/i.test(strip(line).slice(0, 7))) {
        cur = { cycle: !!h[1], header: strip(h[2]), sent: pendingSent || defaultSent, lines: [] };
        msgs.push(cur);
        continue;
      }
      if (cur) cur.lines.push(line);
    }
    const out = [];
    for (const msg of msgs) {
      if (msg.cycle) {
        for (const ln of msg.lines) {
          const s = strip(ln);
          const c = s.match(/^([^:]{1,40}):\s*(.+)$/);
          if (!c) continue;
          const dm = c[2].match(/\((\d{1,2})\/(\d{1,2})\)/);
          const [title, ...rest] = c[2].split(/(?<=\))\.\s*/);
          out.push({ sentDate: msg.sent, refDate: dm ? inferDate(+dm[1], +dm[2], msg.sent) : msg.sent, account: `${msg.header} - ${c[1].trim()}`, client: msg.header,
            kind: "ciclo", category: "ciclo", severity: "critico", title: strip(title).replace(/\.$/, ""), lines: rest.map(strip).filter(Boolean) });
        }
        continue;
      }
      let ref = null, issue = null;
      const issues = [];
      for (const ln of msg.lines) {
        const s = strip(ln);
        if (!s) continue;
        const dm = s.match(/^Dados de .*\((\d{1,2})\/(\d{1,2})\)/i);
        if (dm) { ref = inferDate(+dm[1], +dm[2], msg.sent); continue; }
        if (TITLE_RE.test(s)) { issue = { title: s, lines: [] }; issues.push(issue); continue; }
        if (issue) issue.lines.push(s);
      }
      const client = msg.header.split(/\s+-\s+/)[0].trim();
      for (const it of issues) {
        const c = classify(it.title);
        out.push(finishIssue({ sentDate: msg.sent, refDate: ref || addDays(msg.sent, -1), account: msg.header, client, ...c, title: it.title, lines: it.lines }));
      }
    }
    return out;
  }
  const alertId = a => `${a.sentDate}_${slug(a.account)}_${a.kind}`.slice(0, 190);

  // ---------- derived ----------
  const gestorOf = account => (S.contas[slug(account)] || {}).gestor || "";
  const gestorName = gid => (S.gestores[gid] || {}).name || "";
  const keyOf = a => slug(a.account) + "|" + a.kind;

  function indexByDay() {
    const m = new Map();
    for (const a of S.alerts) { if (!m.has(a.sentDate)) m.set(a.sentDate, new Set()); m.get(a.sentDate).add(keyOf(a)); }
    return m;
  }
  function streak(a, idx) {
    let n = 1, d = a.sentDate;
    for (;;) { d = addDays(d, -1); const s = idx.get(d); if (s && s.has(keyOf(a))) n++; else break; if (n > 60) break; }
    return n;
  }
  function groupCards(list) {
    const m = new Map();
    for (const a of list) {
      const k = a.sentDate + "|" + slug(a.account);
      if (!m.has(k)) m.set(k, { key: k, account: a.account, client: a.client, sentDate: a.sentDate, refDate: a.refDate, issues: [] });
      m.get(k).issues.push(a);
    }
    const cards = [...m.values()];
    for (const c of cards) {
      c.issues.sort((x, y) => (SEV_RANK[y.severity] || 0) - (SEV_RANK[x.severity] || 0));
      const live = c.issues.filter(i => i.status !== "resolvido");
      c.status = live.length === 0 ? "resolvido" : live.some(i => i.status !== "notificado") ? "aberto" : "notificado";
      c.sev = (live.length ? live : c.issues).reduce((b, i) => (SEV_RANK[i.severity] || 0) > (SEV_RANK[b] || 0) ? i.severity : b, "config");
      c.gestor = gestorOf(c.account);
      c.notifiedAt = Math.max(0, ...c.issues.map(i => i.notifiedAt || 0)) || null;
      c.notifiedBy = (c.issues.find(i => i.notifiedAt === c.notifiedAt) || {}).notifiedBy || null;
      c.resolvedAt = c.status === "resolvido" ? Math.max(0, ...c.issues.map(i => i.resolvedAt || 0)) || null : null;
    }
    const sRank = { aberto: 0, notificado: 1, resolvido: 2 };
    cards.sort((a, b) => sRank[a.status] - sRank[b.status] || (SEV_RANK[b.sev] || 0) - (SEV_RANK[a.sev] || 0) || a.account.localeCompare(b.account));
    return cards;
  }

  // ---------- números, grafismos e estatísticas ----------
  const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const ANIM = {}, RING = {};
  function animateNumbers(root) {
    root.querySelectorAll("[data-anim]").forEach(n => {
      const key = n.dataset.anim, target = Number(n.dataset.val), suf = n.dataset.suffix || "";
      const fmt = v => Math.round(v).toLocaleString("pt-BR") + suf;
      const from = ANIM[key]; ANIM[key] = target;
      if (REDUCED || from === target || !isFinite(target)) { n.textContent = fmt(target); return; }
      const start = from == null ? 0 : from, t0 = performance.now(), dur = 700;
      n.textContent = fmt(start);
      const step = t => {
        const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        n.textContent = fmt(start + (target - start) * e);
        if (k < 1 && n.isConnected) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }
  function spark(vals, label) {
    const W = 84, H = 28, n = vals.length;
    if (!n) return null;
    const max = Math.max(1, ...vals);
    const x = i => n === 1 ? W / 2 : (i / (n - 1)) * (W - 6) + 3, y = v => H - 4 - (v / max) * (H - 8);
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const s = el("span", { class: "sparkwrap", title: label });
    s.innerHTML = `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
      <polygon class="spark-area" points="3,${H - 1} ${pts} ${W - 3},${H - 1}"></polygon>
      <polyline class="spark-line" points="${pts}"></polyline>
      <circle class="spark-dot" cx="${x(n - 1).toFixed(1)}" cy="${y(vals[n - 1]).toFixed(1)}" r="2.8"></circle></svg>`;
    return s;
  }
  function ring(pct, key, size = 64) {
    const r = size / 2 - 6, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct || 0));
    const from = RING[key] == null || REDUCED ? p : RING[key]; RING[key] = p;
    const s = el("span", { class: "ringwrap", title: `${Math.round(p * 100)}% resolvido` });
    s.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <circle class="ring-bg" cx="${size / 2}" cy="${size / 2}" r="${r}"></circle>
      <circle class="ringarc" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-dasharray="${(c * from).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"></circle>
      <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" class="ring-txt">${Math.round(p * 100)}%</text></svg>`;
    if (from !== p) requestAnimationFrame(() => requestAnimationFrame(() => { const a = s.querySelector(".ringarc"); if (a) a.setAttribute("stroke-dasharray", `${(c * p).toFixed(1)} ${c.toFixed(1)}`); }));
    return s;
  }
  // ▲/▼ contra o dia anterior. worseUp: subir é ruim (true), bom (false) ou neutro (null)
  function deltaChip(cur, prev, worseUp) {
    if (cur == null || prev == null) return null;
    if (!prev) return cur ? el("span", { class: "delta worse", title: "Ontem não havia" }, "novo") : el("span", { class: "delta", text: "= ontem" });
    const d = (cur - prev) / prev;
    if (d === 0) return el("span", { class: "delta", text: "= ontem" });
    const up = d > 0, tone = worseUp == null ? "" : (up === worseUp ? "worse" : "better");
    return el("span", { class: "delta " + tone, title: "vs dia anterior" }, `${up ? "▲" : "▼"} ${Math.abs(d * 100).toFixed(0)}%`);
  }

  const dayAlerts = d => filtered(S.alerts.filter(a => a.sentDate === d));
  function rangeAlerts() {
    if (S.mode !== "semana") return dayAlerts(S.date);
    const from = addDays(S.date, -6);
    return filtered(S.alerts.filter(a => a.sentDate >= from && a.sentDate <= S.date));
  }
  function statsFor(list, idx) {
    const cards = groupCards(list);
    const n = s => cards.filter(c => c.status === s).length;
    return { cards, contas: cards.length, aberto: n("aberto"), notificado: n("notificado"), resolvido: n("resolvido"),
      critico: cards.filter(c => c.status !== "resolvido" && c.sev === "critico").length,
      repetido: cards.filter(c => c.issues.some(i => streak(i, idx) > 1)).length };
  }

  // ---------- KPIs 3 x 2 ----------
  const KPIS = [
    { key: "contas", label: "Contas com alerta", hint: "toque para ver todas", worseUp: true },
    { key: "aberto", label: "Abertos", hint: "ninguém acionado ainda", status: "aberto", worseUp: true, hero: true },
    { key: "notificado", label: "Notificados", hint: "aguardando o gestor", status: "notificado", worseUp: null },
    { key: "resolvido", label: "Resolvidos", status: "resolvido", worseUp: false, ring: true },
    { key: "critico", label: "Críticos em aberto", hint: "investimento, CPL/CPA, leads e ciclos", extra: "critico", worseUp: true },
    { key: "repetido", label: "Repetidos", hint: "mesmo alerta em 2+ dias seguidos", extra: "repetido", worseUp: true },
  ];
  function kpiActive(k) {
    if (k.extra) return S.extra === k.extra;
    if (k.status) return !S.extra && S.status === k.status;
    return !S.extra && S.status === "todos";
  }
  function renderKpis(box, interactive, prefix = "") {
    box.textContent = "";
    if (!S.loaded) {

      for (const p of parsed) {
        const id = alertId(p);
        const ref = S.db.doc("alerts/" + id);
        const ok = await guarded(async () => {
          const snap = await ref.get();
          const body = { ...p, importedAt: Date.now(), importedBy: S.me };
          if (snap.exists) { dup++; await ref.update(body); }
          else await ref.set({ ...body, status: "aberto", notifiedAt: null, notifiedBy: null, resolvedAt: null, resolvedBy: null });
        });
        if (!ok) break;
        n++;
      }
      closeLayer();
      if (parsed[0]) { S.mode = "dia"; S.date = parsed[0].sentDate; }
      render();
      toast(dup ? `${n - dup} novos, ${dup} já existiam e foram atualizados.` : `${n} problemas importados.`);
    });
    dialog("Importar alertas do WhatsApp",
      el("p", { class: "note", style: "margin:0", text: "No WhatsApp, selecione as mensagens do grupo, copie e cole aqui. Alertas repetidos do mesmo dia são atualizados sem perder o status." }),
      el("label", {}, "Mensagens", ta),
      el("label", { style: "max-width:240px" }, "Recebidas em (quando o texto não traz a data)", date),
      prev,
      el("div", { class: "acts" }, el("button", { type: "button", class: "btn ghost", text: "Cancelar", onclick: closeLayer }), go));
  }

  function openGestores() {
    const list = el("div", { class: "glist" });
    const draw = () => {
      list.textContent = "";
      const entries = Object.entries(S.gestores).sort((a, b) => a[1].name.localeCompare(b[1].name));
      if (!entries.length) list.append(el("p", { class: "note", text: "Nenhum gestor cadastrado ainda." }));
      for (const [id, g] of entries) {
        const name = el("input", { value: g.name, "aria-label": "Nome", id: "gn-" + id });
        const phone = el("input", { value: g.phone || "", placeholder: "+55 11 99999-9999", "aria-label": "WhatsApp", id: "gp-" + id, inputmode: "tel" });
        const save = () => { if (name.value.trim() && (name.value !== g.name || phone.value !== (g.phone || ""))) guarded(() => S.db.doc("gestores/" + id).update({ name: name.value.trim(), phone: phone.value.trim() })); };
        name.addEventListener("change", save); phone.addEventListener("change", save);
        const nAcc = Object.values(S.contas).filter(c => c.gestor === id).length;
        list.append(el("div", { class: "grow" }, el("div", { style: "display:grid;gap:2px;min-width:0" }, name, el("span", { class: "note", text: g.clickupName ? `ClickUp: ${g.clickupName}` : "ClickUp: vincula na primeira notificação" })), phone,
          el("button", { type: "button", class: "mini", title: nAcc ? `${nAcc} contas usam este gestor` : "", text: "Remover",
            onclick: async () => { await guarded(() => S.db.doc("gestores/" + id).delete()); } })));
      }
    };
    draw();
    const nn = el("input", { placeholder: "Nome do gestor", id: "newName" });
    const np = el("input", { placeholder: "WhatsApp (opcional)", id: "newPhone", inputmode: "tel" });
    const add = el("button", { type: "button", class: "btn", text: "Adicionar", onclick: async () => {
      const name = nn.value.trim(); if (!name) return;
      await guarded(() => S.db.doc("gestores/" + slug(name)).set({ name, phone: np.value.trim() }));
      nn.value = np.value = "";
    } });
    S.redrawGestores = draw;
    dialog("Gestores",
      el("p", { class: "note", text: "O usuário do ClickUp de cada gestor é escolhido no Notificar gestor e fica salvo aqui. O WhatsApp é opcional." }),
      list,
      el("div", { class: "grow" }, nn, np, add),
      el("div", { class: "acts" }, el("button", { type: "button", class: "btn primary", text: "Fechar", onclick: () => { S.redrawGestores = null; closeLayer(); } })));
  }

  // ---------- controls ----------
  $("#qHoje").onclick = () => { S.mode = "dia"; S.date = TODAY; render(); };
  $("#qOntem").onclick = () => { S.mode = "dia"; S.date = addDays(TODAY, -1); render(); };
  $("#q7").onclick = () => { S.mode = S.mode === "semana" ? "dia" : "semana"; render(); };
  $("#prevDay").onclick = () => { S.date = addDays(S.date, S.mode === "semana" ? -7 : -1); render(); };
  $("#nextDay").onclick = () => { const n = addDays(S.date, S.mode === "semana" ? 7 : 1); S.date = n > TODAY ? TODAY : n; render(); };
  $("#datePick").max = TODAY;
  $("#datePick").onchange = e => { if (e.target.value) { S.date = e.target.value > TODAY ? TODAY : e.target.value; render(); } };
  $("#statusSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.status = b.dataset.s; S.extra = ""; saveFilters(); render(); };
  $("#btnTema").onclick = () => setTema(document.documentElement.dataset.tema === "escuro" ? "claro" : "escuro");
  setTema(document.documentElement.dataset.tema === "escuro" ? "escuro" : "claro");
  $("#btnTv").onclick = () => { if (S.mode === "semana") S.mode = "dia"; tvStart(); };
  $("#gestorFilter").onchange = e => { S.gestor = e.target.value; render(); };
  $("#search").oninput = e => { S.q = e.target.value; render(); };
  $("#btnImport").onclick = () => { if (S.db && S.canWrite) openImport(); else toast("Abra logado no claude.ai para importar."); };
  $("#btnGestores").onclick = () => { if (S.db) openGestores(); else toast("Abra logado no claude.ai para gerenciar gestores."); };

  // ---------- boot ----------
  S.loading = true;
  render();
  (async () => {
    const live = $("#live");
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    S.loading = false;
    if (!db) { S.loaded = true; live.querySelector("span").textContent = "Offline"; render(); return; }
    S.db = db;
    window.claude.use("mcp").then(m => { S.mcp = m; });
    const user = await window.claude.use("user");
    S.user = user;
    if (user) {
      S.me = await user.id();
      const cw = await user.can("data.write");
      if (cw === false) S.canWrite = false;
    }
    $("#btnImport").hidden = !S.canWrite;
    const fail = () => { S.loaded = true; live.className = "live off"; live.querySelector("span").textContent = "Sem conexão"; render(); };
    db.collection("alerts").orderBy("sentDate", "desc").limit(1000).onSnapshot(snap => {
      S.alerts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.loaded = true;
      live.className = "live"; live.querySelector("span").textContent = "Ao vivo";
      render();
    }, fail);
    db.collection("gestores").onSnapshot(snap => {
      S.gestores = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
      renderGestorOptions(); render();
      if (S.redrawGestores) S.redrawGestores();
    }, fail);
    db.collection("contas").onSnapshot(snap => {
      S.contas = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
      render();
    }, fail);
  })();
})();
</script>
